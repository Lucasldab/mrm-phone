# Versions follow nocturne's phone app (~/src/nocturne/phone) so both apps
# move together; the network/image/work entries are mrm-phone's own.
[versions]
agp = "8.13.0"
kotlin = "2.1.20"
composeBom = "2026.04.01"
material3 = "1.4.0"
navigation = "2.9.8"
kotlinxSerialization = "1.8.1"
lifecycle = "2.9.0"
lifecycleViewmodelCompose = "2.9.0"
activityCompose = "1.10.1"
datastorePreferences = "1.1.1"
coroutines = "1.9.0"
okhttp = "4.12.0"
coil = "3.2.0"
work = "2.10.1"
robolectric = "4.13"
androidxJunitExt = "1.2.1"
androidxTestCore = "1.6.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
compose-bom                 = { group = "androidx.compose",    name = "compose-bom",  version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation          = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3           = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
activity-compose            = { group = "androidx.activity",   name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
datastore-preferences       = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastorePreferences" }
okhttp                      = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver        = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
coil-compose                = { group = "io.coil-kt.coil3",    name = "coil-compose", version.ref = "coil" }
coil-network-okhttp         = { group = "io.coil-kt.coil3",    name = "coil-network-okhttp", version.ref = "coil" }
work-runtime                = { group = "androidx.work",       name = "work-runtime-ktx", version.ref = "work" }

# Test
junit                       = { group = "junit",               name = "junit", version = "4.13.2" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric                 = { group = "org.robolectric",     name = "robolectric", version.ref = "robolectric" }
androidx-junit              = { group = "androidx.test.ext",   name = "junit", version.ref = "androidxJunitExt" }
androidx-test-core          = { group = "androidx.test",       name = "core-ktx", version.ref = "androidxTestCore" }
