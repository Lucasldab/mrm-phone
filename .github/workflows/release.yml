# Build and publish a signed APK when a version tag is pushed (copied from
# nocturne's release.yml). Obtainium on the phone watches Releases.
#
# Signed with nocturne's key (one key to back up for both apps).
# Required repository secrets:
#   KEYSTORE_BASE64    base64 of ~/keystore/nocturne-release.jks
#   KEYSTORE_PASSWORD  its store password (key password is the same)

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Gate the APK on the unit tests: Obtainium auto-installs whatever lands in
  # Releases, so a red suite must stop the build rather than ship past it.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to attach the APK to the release

    steps:
      - uses: actions/checkout@v7

      # AGP 8.13 supports JDK 17/21. NOT 26.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — the APK would be"
            echo "::error::unsigned and could not update the installed app."
            echo "::error::Refusing to publish."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          MRM_PHONE_KEYSTORE: ${{ runner.temp }}/release.jks
          MRM_PHONE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Confirm it is really signed with our key
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk: $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
            | grep -i 'signer #1 certificate' || { echo "::error::APK is not signed"; exit 1; }

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Keep the artefact even if the release step is skipped
        uses: actions/upload-artifact@v7
        with:
          name: mrm-phone-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
